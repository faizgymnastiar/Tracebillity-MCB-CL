# Frontend LELCO Traceability MCB CL — semua trafik masuk lewat Next.js.
# Next.js yang mem-proxy ke trace-api:8080 dan menerjemahkan cookie sesi menjadi header operator.
upstream trace_web {
    server trace-web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/csv text/plain text/css application/json application/javascript;

    location = /healthz {
        proxy_pass http://trace_web/api/v1/health;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://trace_web;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://trace_web;
    }
}
